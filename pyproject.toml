[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "high-stakes"
version = "1.1.1"
description = "A rigor engine for high-stakes decisions: blind adversarial panel, refutation, and code verification"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alessio Alionco" }]
requires-python = ">=3.11"          # tomllib in the stdlib

# ZERO dependencies, on purpose. The only network use is HTTP, done with the stdlib's
# `urllib` (high_stakes/http_client.py). Installing the plugin has to be the only step:
# a missing dependency would fail AFTER the brief and the approved cost.
dependencies = []

keywords = ["decision-making", "red-team", "llm", "adversarial", "claude-code"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/alessioalionco/high-stakes"

[tool.setuptools]
packages = ["high_stakes"]

[tool.setuptools.package-data]
# Contracts and CSS travel WITH the code: the engine reads the .md files high in the
# flow and the renderer reads the .css. Outside the package, both vanish on a clean
# install.
high_stakes = ["core/*.md", "core/sections/*.md", "assets/*.css"]
