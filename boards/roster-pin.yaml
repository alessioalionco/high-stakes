# Roster PIN — quem julga, e por quê.
#
# O motor não escolhe modelo por gosto: os assentos saíram de um experimento que mediu
# contribuição marginal por dólar sobre células IDÊNTICAS. Trocar por moda ("saiu modelo
# novo") desfaz a comparação — re-decida com dado, não com release note.
#
# O pin CONGELA o roster dentro de um loop: se os juízes mudam no meio, a comparação
# entre rodadas morre. Re-pesquise só sob gatilho: pin vencido (ttl_days) · release
# relevante · o domínio exige competência que o pin não tem.
#
# Copie para $HIGH_STAKES_HOME/roster-pin.yaml (default ~/.high-stakes/) para editar.
pinned: 1970-01-01        # <- troque pela data em que VOCÊ fixou este roster.
                          #    Enquanto for esta, o pin conta como VENCIDO de propósito:
                          #    força re-verificar o roster antes da primeira decisão.
ttl_days: 30
source: "medição de contribuição marginal por dólar sobre células idênticas"

# Sintetiza o dossiê e NÃO vota — quem escreve a síntese não pode ser parte do júri.
chairman: {model: anthropic/claude-fable-5, family: anthropic, votes: false}

# Júri do preset quick. Famílias diferentes de propósito: dois modelos da mesma família
# erram junto, e um painel que erra junto não é painel.
quick_judges:
  - {model: openai/gpt-5.6-sol, family: openai}
  - {model: x-ai/grok-4.5, family: xai}
  - {model: z-ai/glm-5.2, family: zai, reasoning: off}

# 4º assento, só no preset cheio.
full_extra_judge: {model: moonshotai/kimi-k3, family: moonshot, reasoning: off}

# Refutador: ataca o consenso do painel. Papel separado do júri de propósito — quem
# julga não pode ser quem refuta.
refuter: {model: google/gemini-3.1-pro-preview, family: google}
