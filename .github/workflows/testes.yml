name: testes

# Por que existe: a suíte é a única testemunha do que este motor promete, e sem CI
# "todas verdes" vira afirmação que só vale na máquina de quem escreveu. Roda em push,
# em PR e semanalmente — o semanal existe porque a promessa de ZERO dependência é
# verificada por AST contra a stdlib da versão instalada, e uma versão nova de Python
# pode quebrá-la sem ninguém tocar no código.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # segunda, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read          # o workflow só lê o repo; nada aqui escreve nem publica

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false    # quero ver TODAS as versões que quebram, não só a primeira
      matrix:
        python: ["3.11", "3.13"]   # 3.11 = o piso do pyproject; 3.13 = o que o usuário tem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: sem instalar nada (a promessa é stdlib pura)
        # Não há `pip install` de propósito. Se um dia aparecer um, é porque a
        # promessa D8 (zero dependência externa) foi quebrada — e o passo abaixo
        # deve ter falhado ANTES. Este comentário é o alarme para quem for adicionar.
        run: python -c "import sys; print(sys.version)"

      - name: suíte executável (convenção do projeto — PASS/exit≠0, sem framework)
        env:
          # a suíte não fala com provedor nenhum: o test_or_client sobe um
          # http.server local. Uma key vazando pro CI não é usada, mas o
          # test_install_smoke checa que o produto não depende dela.
          OPENROUTER_API_KEY: ""
        run: |
          falhou=0
          for t in tests/test_*.py; do
            nome="tests.$(basename "$t" .py)"
            echo "::group::$nome"
            if python -m "$nome"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error title=suíte vermelha::$nome"
              falhou=1
            fi
          done
          exit $falhou
